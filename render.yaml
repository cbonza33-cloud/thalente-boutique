services:
  - type: web
    name: thalente-boutique-electronics
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set a real secret PIN in the Render dashboard — do not commit one.
      - key: ADMIN_PIN
        sync: false
      # Get this from your Yoco merchant dashboard. Leave unset to run in
      # safe "demo mode" (orders auto-complete locally, no real charge).
      - key: YOCO_SECRET_KEY
        sync: false
      # Your live Render URL, e.g. https://thalente-boutique-electronics.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Required for product image uploads to work (see README.md for setup).
      # Get these from your Supabase project settings.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    # Persists the SQLite database (products, orders, receipts, notifications)
    # across deploys and restarts. Render only allows one disk per service, so
    # public/uploads is intentionally NOT on this disk and is NOT used for
    # permanent product photos — those are stored in Supabase Storage instead
    # (see SUPABASE_* vars above), which is unaffected by redeploys. public/uploads
    # is still used for quote-request portfolio attachments only, which remain
    # ephemeral (out of scope for the product-image fix).
    disk:
      name: thalente-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
